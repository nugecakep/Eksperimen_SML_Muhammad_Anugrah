name: Data Preprocessing Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  preprocessing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run automated preprocessing
        run: python preprocessing/automate_Muhammad_Anugrah.py

      - name: Show generated files
        run: ls -R preprocessing/breast_cancer_preprocessing

      - name: Upload preprocessed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: breast-cancer-preprocessing-dataset
          path: preprocessing/breast_cancer_preprocessing/
